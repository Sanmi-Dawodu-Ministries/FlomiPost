<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Grace Parish Registration</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #5c6370;
      --border: #d6d2c8;
      --accent: #6b4f2a;
      --accent-text: #ffffff;
      --error: #b42318;
      --success: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171a;
        --card: #1f2125;
        --text: #e8e6e1;
        --muted: #a3a7ae;
        --border: #3a3d43;
        --accent: #c9a46a;
        --accent-text: #16171a;
        --error: #f97066;
        --success: #4ac26b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .lede { margin: 0 0 24px; color: var(--muted); }
    .field { margin-bottom: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .optional { font-weight: 400; color: var(--muted); }
    input {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    input[aria-invalid="true"] { border-color: var(--error); }
    .error { color: var(--error); font-size: 0.875rem; margin-top: 4px; min-height: 0; }
    .hp { position: absolute; left: -9999px; }
    button {
      width: 100%;
      padding: 12px;
      font: inherit;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { margin-top: 16px; font-weight: 600; }
    .status.ok { color: var(--success); }
    .status.fail { color: var(--error); }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Grace Parish Registration</h1>
    <p class="lede">Tell us about your parish and its shepherd.</p>

    <form id="grace-form" novalidate>
      <div class="field">
        <label for="parish_name">Parish name</label>
        <input id="parish_name" name="parish_name" required maxlength="200" autocomplete="organization">
        <div class="error" data-for="parish_name"></div>
      </div>

      <div class="field">
        <label for="shepherd_name">Name of the shepherd</label>
        <input id="shepherd_name" name="shepherd_name" required maxlength="200" autocomplete="name">
        <div class="error" data-for="shepherd_name"></div>
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" required maxlength="30" autocomplete="tel"
               placeholder="+234 803 123 4567">
        <div class="error" data-for="phone"></div>
      </div>

      <div class="row">
        <div class="field">
          <label for="city">City</label>
          <input id="city" name="city" required maxlength="120" autocomplete="address-level2">
          <div class="error" data-for="city"></div>
        </div>
        <div class="field">
          <label for="county">County <span class="optional">(if any)</span></label>
          <input id="county" name="county" maxlength="120">
          <div class="error" data-for="county"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="state">State / Province</label>
          <input id="state" name="state" required maxlength="120" autocomplete="address-level1">
          <div class="error" data-for="state"></div>
        </div>
        <div class="field">
          <label for="country">Country</label>
          <input id="country" name="country" required maxlength="120" autocomplete="country-name">
          <div class="error" data-for="country"></div>
        </div>
      </div>

      <!-- Honeypot for bots; hidden from people and screen readers. -->
      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit">Submit</button>
      <p class="status" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>

<script>
  (function () {
    var ENDPOINT = '/api/grace/parishes';
    var form = document.getElementById('grace-form');
    var button = form.querySelector('button');
    var status = form.querySelector('.status');

    function showErrors(errors) {
      form.querySelectorAll('.error').forEach(function (el) {
        var name = el.getAttribute('data-for');
        var msg = errors[name] || '';
        el.textContent = msg;
        form.elements[name].setAttribute('aria-invalid', msg ? 'true' : 'false');
      });
    }

    function validate(data) {
      var errors = {};
      form.querySelectorAll('input[required]').forEach(function (input) {
        if (!data[input.name]) errors[input.name] = 'This field is required.';
      });
      if (data.phone && !errors.phone) {
        var digits = data.phone.replace(/\D/g, '');
        if (!/^\+?[\d\s().-]+$/.test(data.phone) || digits.length < 7 || digits.length > 15) {
          errors.phone = 'Enter a valid phone number.';
        }
      }
      return errors;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      status.textContent = '';
      status.className = 'status';

      var data = {};
      new FormData(form).forEach(function (v, k) { data[k] = String(v).trim(); });

      var errors = validate(data);
      showErrors(errors);
      if (Object.keys(errors).length) {
        form.querySelector('[aria-invalid="true"]').focus();
        return;
      }

      button.disabled = true;
      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (body) {
            return { status: res.status, body: body };
          });
        })
        .then(function (r) {
          if (r.status === 201) {
            form.reset();
            status.textContent = 'Thank you — your parish has been registered.';
            status.classList.add('ok');
          } else if (r.status === 422 && r.body.errors) {
            showErrors(r.body.errors);
          } else {
            throw new Error('Unexpected response');
          }
        })
        .catch(function () {
          status.textContent = 'Something went wrong. Please try again.';
          status.classList.add('fail');
        })
        .finally(function () { button.disabled = false; });
    });
  })();
</script>
</body>
</html>
